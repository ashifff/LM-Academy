<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance | LM Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="status-page">
    <div class="status-box">
      <span class="section-subtitle">SYSTEM UPGRADE</span>
      <h2 style="font-size: 2rem; margin: 12px 0;">We Are Upgrading Our Campus Portal</h2>
      <p style="color: var(--text-muted); margin-bottom: 25px;">
        LM Academy is currently performing scheduled platform enhancements to make your learning experience even smoother.
      </p>
      <div style="background: var(--light-bg); padding: 18px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border-color);">
        <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Estimated Time Remaining</span>
        <strong id="countdown" style="font-family: 'Montserrat', sans-serif; font-size: 1.6rem; color: var(--primary-color);">02h : 00m : 00s</strong>
      </div>
      <a href="index.html" class="btn btn-outline">Return to Main Site</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
